global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

receivers:
  - name: 'default'
    # Add email, Slack, PagerDuty, etc. configuration here
    # Example for email:
    # email_configs:
    #   - to: 'alerts@energy-trading.com'
    #     from: 'alertmanager@energy-trading.com'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'alertmanager@energy-trading.com'
    #     auth_password: 'your-password'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']
