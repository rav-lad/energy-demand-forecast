# ──────────────────────────────────────────────────────────────────────────────
# Shared volumes (host-mounted so containers exchange data via filesystem)
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./outputs/models
  predictions:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./outputs/predictions
  reports:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./outputs/reports
  logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

# ──────────────────────────────────────────────────────────────────────────────
# Shared env — copy .env.example → .env and fill in your API keys
# ──────────────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  env_file: .env
  environment:
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app

# ──────────────────────────────────────────────────────────────────────────────
# Services — 1 container per process, all built from the same Dockerfile
# ──────────────────────────────────────────────────────────────────────────────
services:

  data-collector:
    build:
      context: .
      target: data-collector
    image: energy-forecast/data-collector:latest
    container_name: energy-data-collector
    <<: *common-env
    volumes:
      - data:/app/data
      - logs:/app/logs
    restart: "no"

  trainer:
    build:
      context: .
      target: trainer
    image: energy-forecast/trainer:latest
    container_name: energy-trainer
    <<: *common-env
    volumes:
      - data:/app/data
      - models:/app/outputs/models
      - logs:/app/logs
    restart: "no"

  trainer-quantile:
    build:
      context: .
      target: trainer-quantile
    image: energy-forecast/trainer-quantile:latest
    container_name: energy-trainer-quantile
    <<: *common-env
    volumes:
      - data:/app/data
      - models:/app/outputs/models
      - logs:/app/logs
    restart: "no"

  inference:
    build:
      context: .
      target: inference
    image: energy-forecast/inference:latest
    container_name: energy-inference
    <<: *common-env
    volumes:
      - data:/app/data
      - models:/app/outputs/models
      - predictions:/app/outputs/predictions
      - logs:/app/logs
    restart: "no"

  backtest:
    build:
      context: .
      target: backtest
    image: energy-forecast/backtest:latest
    container_name: energy-backtest
    <<: *common-env
    volumes:
      - data:/app/data
      - models:/app/outputs/models
      - reports:/app/outputs/reports
      - logs:/app/logs
    restart: "no"

  dashboard:
    build:
      context: .
      target: dashboard
    image: energy-forecast/dashboard:latest
    container_name: energy-dashboard
    <<: *common-env
    ports:
      - "8501:8501"
    volumes:
      - data:/app/data
      - models:/app/outputs/models
      - predictions:/app/outputs/predictions
      - reports:/app/outputs/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
